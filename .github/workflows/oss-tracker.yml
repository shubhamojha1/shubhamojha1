name: Track OSS Contributions

on:
  schedule:
    - cron: '0 6 * * 1,4'   # Mon & Thu, 6 AM UTC — change the day/hour here
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      GH_USERNAME: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test tracker scripts
        run: bash tests/test-oss-tracker.sh

      - name: Track merged PRs
        run: bash scripts/track-contributions.sh

      - name: Render README
        run: bash scripts/render-readme.sh

      - name: Commit if anything changed
        run: |
          git config user.name "oss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add contribution_blocklist.json contributions.json known_prs.json README.md
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: sync OSS contributions"
          git push
